name: Amp Runner
version: "0.1.1"
slug: amp_runner
description: Runs the Amp coding agent headless (amp --no-tui) as a supervised service
url: https://github.com/procrastivity/amp-runner-for-home-assistant
arch:
  - aarch64
  - amd64
startup: services
init: false              # s6-overlay is PID 1; Docker's init must stay off

# System access. Amp needs broad access to debug and configure the system.
hassio_api: true
hassio_role: admin       # full Supervisor API (the `ha` CLI uses it)
homeassistant_api: true
docker_api: true         # Docker socket; the user must turn off protection mode
full_access: true        # all devices, privileged; the user must turn off protection mode
host_network: true
# No host_pid: s6-overlay must run as PID 1, and host_pid prevents that.

map:
  - type: homeassistant_config
    read_only: false
  - type: all_app_configs
    read_only: false
  - type: local_apps
    read_only: false
  - type: share
    read_only: false
  - type: backup
    read_only: false
  - type: media
    read_only: false
  - type: ssl
    read_only: false

options:
  remote_control_terminal: false
  working_directory: /homeassistant
schema:
  # Amp requires a valid hostname: dot-separated labels of letters, digits, and hyphens.
  runner_id: 'match(^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$)?'
  remote_control_terminal: bool
  api_key: password?
  working_directory: str
